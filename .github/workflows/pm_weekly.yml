name: Weekly PM Report
on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * 1'
permissions:
  contents: read
  issues: read
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Export real issues and calculate metrics
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/project_report.py --live
      - uses: actions/upload-artifact@v4
        with:
          name: weekly-pm-report
          path: reports/project/
