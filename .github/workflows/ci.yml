name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SECRET_KEY: ci-only-session-secret
      ADMIN_USERNAME: ci_admin
      ADMIN_PASSWORD: ci-only-password
      FLASK_DEBUG: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: python -m ruff check app.py assistant_service.py db_integrity.py maintenance.py monitor.py tests scripts --select E4,E7,E9,F
      - name: Tests
        run: python -m pytest tests -v --junitxml=reports/tests.xml
      - name: JavaScript syntax
        run: find static/js -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Dependency audit
        run: python -m pip_audit -r requirements.txt --format json -o reports/dependency-audit.json
      - name: Locale audit
        run: python scripts/audit_locales.py --strict
      - name: Build clean source artifact
        run: |
          mkdir -p dist
          git archive --format=zip --output=dist/TABLE-source.zip HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TABLE-checks-and-source
          path: |
            reports/
            dist/
