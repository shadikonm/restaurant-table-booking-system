<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>TABLE — Вход</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/user_auth.css') }}"
    >
</head>

<body>

<header class="auth-header">

    <a
        href="{{ url_for('home') }}"
        class="logo"
    >
        TABLE
    </a>

    <div class="header-actions">

        <a href="{{ url_for('home') }}">
            На сайт
        </a>

        <a href="{{ url_for('register') }}">
            Регистрация
        </a>

    </div>

</header>


<main class="auth-page">

    <section class="auth-intro">

        <p class="eyebrow">
            ЛИЧНЫЙ КАБИНЕТ
        </p>

        <h1>
            Вход
        </h1>

        <p class="auth-description">
            Войдите, чтобы посмотреть бронирования,
            связанные с вашим аккаунтом.
        </p>

    </section>


    <section class="auth-card">

        <h2 class="auth-card-title">
            Войти в аккаунт
        </h2>


        {% if error %}

            <div class="auth-error">
                {{ error }}
            </div>

        {% endif %}


        <form
            method="POST"
            class="auth-form"
        >

            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="name@example.com"
                    autocomplete="email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Пароль
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Введите пароль"
                    autocomplete="current-password"
                    required
                >

            </div>


            <button
                type="submit"
                class="auth-submit"
            >
                Войти
            </button>

        </form>


        <div class="auth-footer">

            Нет аккаунта?

            <a href="{{ url_for('register') }}">
                Зарегистрироваться
            </a>

        </div>

    </section>

</main>

</body>

</html>
